{{ define "main" }}
<section class="page-hero compact{{ if eq .Section "news" }} news-hero{{ else if eq .Section "projects" }} project-hero{{ else if eq .Section "research" }} research-hero{{ end }}">
  <p class="eyebrow">{{ .Section | humanize }}</p>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</section>
<article class="page-body{{ if eq .Section "news" }} news-body{{ else if eq .Section "projects" }} project-body{{ else if eq .Section "research" }} research-body{{ end }}">
  {{ .Content }}
</article>
{{ end }}
