baseURL = 'https://lcds-lab.github.io/'
locale = 'en-us'
title = 'Longitudinal Causal Data Science Lab'
buildFuture = true
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
disableLanguages = ['zh']

[params]
  description = 'The Longitudinal Causal Data Science Lab at the University of Florida advances longitudinal study design, causal evaluation, education data science, AI, and cost-effectiveness methods for education decisions.'
  author = 'Longitudinal Causal Data Science Lab'
  ufUnit = 'College of Education, University of Florida'
  contactEmail = 'wei.li@coe.ufl.edu'
  personalWebsite = 'https://sites.google.com/view/weiliedu/home'
  googleAnalyticsID = 'G-65G6MVMBW3'
  showChineseVersion = false

[languages]
  [languages.en]
    locale = 'en-us'
    label = 'English'
    title = 'Longitudinal Causal Data Science Lab'
    weight = 1

  [languages.zh]
    locale = 'zh-Hans'
    label = '中文'
    title = '纵向因果数据科学实验室'
    weight = 2

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

